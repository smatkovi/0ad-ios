name: "Build: simulator"

# Dependencies, then the engine. Separate from the probes: this is the long one,
# and everything it builds is cached, so a failure a third of the way through
# does not start over.
#
# Both halves run in the same job because premake needs the dependencies in the
# same tree (libraries/macos), and passing a 600 MB SpiderMonkey between jobs
# through an artifact would cost more than building the engine.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'patches/**'
      - 'tools/get-source.sh'
      - 'tools/build-deps-ios.sh'
      - 'tools/build-mozjs-ios.sh'
      - 'tools/ios-build.sh'
      - 'tools/show-platform.sh'
      - 'tools/make-app.sh'
      - 'tools/get-mod-data.sh'
      - 'tools/symbolicate.py'
      - '.github/workflows/build.yml'

jobs:
  simulator:
    name: pyrogenesis for the simulator
    runs-on: macos-14
    timeout-minutes: 300
    env:
      SDK: iphonesimulator
      SRC: ${{ github.workspace }}/ext/0ad-0.28.0
    steps:
      - uses: actions/checkout@v4

      - run: brew install ninja autoconf automake libtool

      - name: Cache the 0 A.D. source tarball
        uses: actions/cache@v4
        with:
          path: ext/0ad-0.28.0-unix-build.tar.xz
          key: zeroad-src-0.28.0

      # Restore and save separately, so a run that dies halfway keeps what it
      # built: the libraries are the expensive part (ICU wants a native build
      # first, SpiderMonkey is four minutes of its own).
      - name: Restore dependencies
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            ext/0ad-0.28.0/libraries/macos
            ext/0ad-0.28.0/libraries/source/spidermonkey/lib
            ext/0ad-0.28.0/libraries/source/spidermonkey/include-release
          key: deps-iphonesimulator-0.28.0-v3
          restore-keys: deps-iphonesimulator-0.28.0-v3-

      - name: Fetch and patch the source
        run: tools/get-source.sh

      - name: Build the dependencies
        id: deps
        run: |
          set -o pipefail
          tools/build-deps-ios.sh "$SDK" "$SRC" 2>&1 | tail -n 400

      - name: Save dependencies
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ext/0ad-0.28.0/libraries/macos
            ext/0ad-0.28.0/libraries/source/spidermonkey/lib
            ext/0ad-0.28.0/libraries/source/spidermonkey/include-release
          key: deps-iphonesimulator-0.28.0-v3-${{ github.run_id }}

      - name: Build pyrogenesis
        run: |
          set -o pipefail
          tools/ios-build.sh "$SDK" "$SRC" 2>&1 | tail -n 200

      - name: What came out
        if: always()
        run: |
          ls -la "$SRC/binaries/system" || true
          tools/show-platform.sh "$SRC/binaries/system/pyrogenesis" || true
          # Does anything in here replace the system allocator? SpiderMonkey's
          # mozglue does on some platforms, and a process where the frameworks
          # allocate with one malloc and free with another crashes exactly the
          # way this one does: a null pointer deep inside libdispatch, at
          # different call sites each time.
          echo "--- eigene malloc-Definitionen im Programm:"
          nm -g "$SRC/binaries/system/pyrogenesis" 2>/dev/null \
              | grep -E " T _(malloc|free|realloc|calloc|valloc|posix_memalign)$" || echo "(keine)"
          echo "--- und in SpiderMonkey:"
          nm -g "$SRC/libraries/source/spidermonkey/lib/libmozjs128-release.a" 2>/dev/null \
              | grep -E " T _(malloc|free|realloc|calloc)$" | sort -u | head || echo "(keine)"
          echo "--- replace_malloc?"
          nm -g "$SRC/libraries/source/spidermonkey/lib/libmozjs128-release.a" 2>/dev/null \
              | grep -i "replace_malloc\|mozmem" | head -5 || true

      # The base mod is 89 MB inside a 1.4 GB data release, so it is fetched
      # once and cached, not kept in the repository.
      - name: Cache the base mod
        id: cache-mod
        uses: actions/cache@v4
        with:
          path: ext/smoke-data
          key: smoke-data-0.28.0-mit-public

      - name: Fetch the base mod
        if: steps.cache-mod.outputs.cache-hit != 'true'
        run: tools/get-mod-data.sh

      - name: Bundle it
        run: tools/make-app.sh "$SRC" "$PWD/ext/smoke-data" "$PWD/build/pyrogenesis.app"

      - name: Run it in the simulator
        id: smoke
        run: |
          set -x
          DEV=""
          for name in "iPhone 16" "iPhone 15" "iPhone 14"; do
              DEV=$(xcrun simctl create zeroad "$name" 2>/dev/null) && break
              DEV=""
          done
          test -n "$DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$PWD/build/pyrogenesis.app"
          # Not --console-pty: attached to a pipe it never returns (the GLES
          # probe sat in it for half an hour). The game says what happened in
          # its own logs, and the system log has its stdout.
          START=$(date +%s)
          # No -mod: the default is mod + public, which is the whole game.
          xcrun simctl launch "$DEV" org.smatkovi.zeroad
          CONTAINER=$(xcrun simctl get_app_container "$DEV" org.smatkovi.zeroad data)
          # The simulator renders GLES in software and SpiderMonkey has no JIT,
          # so this takes its time. Look three times instead of once, and ask
          # each time whether the process is actually busy: a picture that does
          # not change while the CPU is pegged is slow, the same picture with an
          # idle process is stuck. That is the difference worth measuring.
          for seconds in 60 120 240; do
              while [ "$(date +%s)" -lt $((START + seconds)) ]; do sleep 5; done
              xcrun simctl io "$DEV" screenshot "simulator-${seconds}s.png" || true
              # The simulator rotates the app to landscape and captures in the
              # device's native portrait, so every screenshot arrives on its
              # side. 270 degrees clockwise puts it upright; measured against
              # the first frame the port ever drew.
              sips -r 270 "simulator-${seconds}s.png" \
                  --out "simulator-${seconds}s.png" > /dev/null 2>&1 || true
              echo "--- nach ${seconds}s:"
              # Three questions, because the first two have each lied once
              # already: `simctl spawn ps` finds no ps inside the runtime, and
              # `ps -p` printed a bare header for a pid that pgrep had just
              # found. An app in the simulator is an ordinary host process, so
              # ask the host; ask launchctl inside the simulator as well; and
              # then ask the only thing that cannot be misread -- whether the
              # game's own log is still growing.
              ps aux | grep "[p]yrogenesis.app/pyrogenesis" \
                  || echo "(kein Host-Prozess)"
              xcrun simctl spawn "$DEV" launchctl list 2>/dev/null \
                  | grep -i zeroad || echo "(launchctl kennt es nicht)"
              wc -c "$CONTAINER/Library/Application Support/0ad/logs/mainlog.html" \
                  2>/dev/null || echo "(kein Protokoll)"
          done
          cp "simulator-240s.png" simulator.png || true
          mkdir -p out
          cp -R "$CONTAINER/Library/Application Support/0ad/logs" out/logs || true
          cp "$CONTAINER/Documents/ios-frames.txt" out/ 2>/dev/null || true
          # interestinglog.html holds the warnings and errors on their own.
          ls -la out/logs || true
          xcrun simctl spawn "$DEV" log show --last 5m --style compact \
              --predicate 'process == "pyrogenesis"' > out/system-log.txt 2>&1 || true
          # A crash lands here rather than in the game's own logs.
          cp ~/Library/Logs/DiagnosticReports/pyrogenesis* out/ 2>/dev/null || true
          xcrun simctl shutdown "$DEV" || true

      - name: What the game said
        if: always()
        run: |
          echo "--- system_info.txt"
          cat "out/logs/system_info.txt" 2>/dev/null || echo "(keine -- so weit kam es nicht)"
          # Reported, never gated: whether openal-soft's CoreAudio backend opens
          # a device in a headless simulator is the open question of the sound,
          # and a missing device is harmless at runtime (SoundManager logs a
          # warning and stays null). system_info.txt says which of the three
          # states happened.
          echo "--- Ton:"
          grep -E "^Sound" out/logs/system_info.txt 2>/dev/null \
              || echo "(keine Tonzeile -- so weit kam es nicht)"
          echo "--- mainlog"
          sed -e 's/<[^>]*>//g' out/logs/mainlog.html 2>/dev/null | tail -60 || true
          echo "--- Absturzbericht?"
          # XPC_EXIT_REASON_SIGTERM_TIMEOUT ist keiner: `simctl shutdown` schickt
          # SIGTERM, und ein Spiel mitten im Bildrueckruf beantwortet das nicht,
          # also raeumt das System es ab. Alles andere zaehlt.
          ECHT=$(grep -L XPC_EXIT_REASON_SIGTERM_TIMEOUT out/*.ips 2>/dev/null || true)
          if ls out/*.ips > /dev/null 2>&1; then
              for report in out/*.ips; do
                  tools/symbolicate.py "$report" \
                      "$PWD/build/pyrogenesis.app/pyrogenesis" || head -40 "$report"
              done
          else
              echo "(keiner)"
          fi
          echo "--- wurde ein Rahmen gezeichnet?"
          cat out/ios-frames.txt 2>/dev/null || echo "(die Datei gibt es nicht -- der Rueckruf lief nie)"
          # Reported, not yet a gate: frames 0-2 are noted before anything need
          # have been drawn, and whether this readback sees the engine's frame
          # or an undefined back buffer is not settled. A non-zero middle pixel
          # is evidence; a zero one is not yet a failure.
          grep "middle pixel" out/ios-frames.txt 2>/dev/null | tail -3 || true
          echo "--- Systemprotokoll"
          tail -40 out/system-log.txt 2>/dev/null || true
          # system_info.txt is written once the window and the GL context stand,
          # so it is the honest marker for "the engine started".
          test -f "out/logs/system_info.txt"
          # And a crash report means it did not survive, whatever the logs say.
          # The job reported success twice while the game was dying.
          test -z "$ECHT"


      # The arm above proves that the menu draws. This one is the other claim,
      # and the bigger one: that a match runs. Map generation is JavaScript on a
      # SpiderMonkey without a JIT, then the simulation steps, Petra gives orders
      # for two players, and terrain and unit meshes go through a GLES that Apple
      # implements in software. Nothing about that is proven by a main menu.
      #
      # The gate is the turn number from the frame note (patch 0030) and not a
      # screenshot: a picture of terrain proves one frame was drawn, a turn
      # number that keeps rising proves the match is still going. The waiting is
      # adaptive, because the time to the first turn is itself a measurement --
      # nobody knows yet what map generation costs here.
      - name: Play a match
        id: partie
        run: |
          set -x
          DEV=""
          for name in "iPhone 16" "iPhone 15" "iPhone 14"; do
              DEV=$(xcrun simctl create zeroad-partie "$name" 2>/dev/null) && break
              DEV=""
          done
          test -n "$DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$PWD/build/pyrogenesis.app"
          # Wie im Ladearm: fremde Berichte wuerden diesem Lauf angerechnet.
          rm -f ~/Library/Logs/DiagnosticReports/pyrogenesis*
          mkdir -p out-partie
          START=$(date +%s)
          # 128 Felder statt der voreingestellten 192: die Karte wird in
          # JavaScript erzeugt und hier in Software gezeichnet, und beides zahlt
          # nach Flaeche. Zwei Petras, damit nichts auf Befehle wartet, endless,
          # damit die Partie nicht von selbst endet, und feste Saatzahlen, damit
          # ein langsamer und ein schneller Lauf dieselbe Partie sind.
          xcrun simctl launch "$DEV" org.smatkovi.zeroad \
              -autostart=random/mainland -autostart-size=128 -autostart-players=2 \
              -autostart-ai=1:petra -autostart-ai=2:petra \
              -autostart-aidiff=1:3 -autostart-aidiff=2:3 \
              -autostart-seed=1 -autostart-aiseed=1 -autostart-victory=endless
          CONTAINER=$(xcrun simctl get_app_container "$DEV" org.smatkovi.zeroad data)
          NOTIZEN="$CONTAINER/Documents/ios-frames.txt"
          # Bis zur ersten Runde: hoechstens 900 s, alle 10 s nachsehen.
          ERSTE=""
          set +x
          while [ "$(date +%s)" -lt $((START + 900)) ]; do
              sleep 10
              if grep -qE "turn [0-9]+" "$NOTIZEN" 2>/dev/null; then
                  ERSTE=$(($(date +%s) - START))
                  break
              fi
          done
          set -x
          echo "erste Runde nach: ${ERSTE:-(keine in 900 s)}s"
          echo "${ERSTE:-}" > out-partie/erste-runde.txt
          xcrun simctl io "$DEV" screenshot partie-erste-runde.png || true
          sips -r 270 partie-erste-runde.png --out partie-erste-runde.png \
              > /dev/null 2>&1 || true
          tail -4 "$NOTIZEN" 2>/dev/null || echo "(keine Notizen)"
          # Und dann drei Minuten weiterspielen lassen: dass eine Runde erreicht
          # wurde, heisst noch nicht, dass die naechste kommt.
          WEITER=$(date +%s)
          set +x
          while [ "$(date +%s)" -lt $((WEITER + 180)) ]; do sleep 10; done
          set -x
          xcrun simctl io "$DEV" screenshot partie-danach.png || true
          sips -r 270 partie-danach.png --out partie-danach.png > /dev/null 2>&1 || true
          cp -R "$CONTAINER/Library/Application Support/0ad/logs" out-partie/logs || true
          cp "$NOTIZEN" out-partie/ 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/pyrogenesis* out-partie/ 2>/dev/null || true
          xcrun simctl shutdown "$DEV" || true

      - name: Did it play
        if: always()
        run: |
          echo "--- Notizen"
          cat out-partie/ios-frames.txt 2>/dev/null || echo "(keine)"
          echo "--- Bildrate (aus der letzten Notiz: Bilder und Millisekunden)"
          awk -F'[ ,]' '/^frame [0-9]+ at [0-9]+ ms/{f=$2; ms=$4}
              END{ if (ms > 0) printf "%.2f Bilder/s ueber %.0f s\n", f*1000/ms, ms/1000;
                   else print "(keine Notiz mit Uhrzeit)" }' \
              out-partie/ios-frames.txt 2>/dev/null || true
          echo "--- Absturzbericht?"
          ECHT=$(grep -L XPC_EXIT_REASON_SIGTERM_TIMEOUT out-partie/*.ips 2>/dev/null || true)
          if ls out-partie/*.ips > /dev/null 2>&1; then
              for report in out-partie/*.ips; do
                  tools/symbolicate.py "$report" \
                      "$PWD/build/pyrogenesis.app/pyrogenesis" || head -40 "$report"
              done
          else
              echo "(keiner)"
          fi
          echo "--- was die Partie im Protokoll hinterlassen hat"
          sed -e 's/<[^>]*>//g' out-partie/logs/mainlog.html 2>/dev/null | tail -30 || true
          # Drei Behauptungen, jede fuer sich: eine Runde wurde ueberhaupt
          # erreicht (die Karte ist erzeugt und die Partie laeuft), die Runden
          # steigen noch (sie laeuft weiter und haengt nicht), und das Programm
          # hat es ueberlebt.
          ERSTE=$(grep -oE "turn [0-9]+" out-partie/ios-frames.txt 2>/dev/null | head -1 | awk '{print $2}')
          LETZTE=$(grep -oE "turn [0-9]+" out-partie/ios-frames.txt 2>/dev/null | tail -1 | awk '{print $2}')
          echo "erste gemeldete Runde: ${ERSTE:-(keine)} / letzte: ${LETZTE:-(keine)}"
          echo "Sekunden bis zur ersten Runde: $(cat out-partie/erste-runde.txt 2>/dev/null)"
          test -n "$LETZTE"
          [ "$LETZTE" -gt "$ERSTE" ]
          test -z "$ECHT"

      # Whether anything is *audible* has been the open question about the sound
      # since the day a device opened: `Sound Card: CoreAudio Default` says that
      # openal-soft found an output, not that one non-silent sample ever reached
      # it. The simulator cannot be listened to -- `simctl io recordVideo` records
      # no audio -- but openal-soft can be told to write what it mixes into a file
      # instead of handing it to CoreAudio. Same engine calls, same decoders, same
      # mixer; only the last hop differs. What that cannot answer is whether a
      # speaker would move, which needs a phone.
      - name: Is there a sound in it
        run: |
          set -x
          DEV=""
          for name in "iPhone 16" "iPhone 15" "iPhone 14"; do
              DEV=$(xcrun simctl create zeroad-ton "$name" 2>/dev/null) && break
              DEV=""
          done
          test -n "$DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$PWD/build/pyrogenesis.app"
          rm -f ~/Library/Logs/DiagnosticReports/pyrogenesis*
          CONTAINER=$(xcrun simctl get_app_container "$DEV" org.smatkovi.zeroad data)
          mkdir -p "$CONTAINER/Documents" out-ton
          # An app in the simulator sees the host's paths, so one absolute path
          # works on both sides. int16, because the wave writer follows the mixer's
          # sample type and reading float32 back would be needless work.
          {
              echo "[general]"
              echo "drivers = wave"
              echo "sample-type = int16"
              echo "[wave]"
              echo "file = $CONTAINER/Documents/ton.wav"
              echo "format = wav"
          } > "$CONTAINER/Documents/alsoft.conf"
          START=$(date +%s)
          SIMCTL_CHILD_ALSOFT_CONF="$CONTAINER/Documents/alsoft.conf" \
          SIMCTL_CHILD_ALSOFT_LOGLEVEL=3 \
          SIMCTL_CHILD_ALSOFT_LOGFILE="$CONTAINER/Documents/openal.log" \
              xcrun simctl launch "$DEV" org.smatkovi.zeroad
          # The menu's music starts once the GUI stands, which the first arm puts
          # at well under a minute; three minutes is room to spare.
          set +x
          while [ "$(date +%s)" -lt $((START + 180)) ]; do sleep 10; done
          set -x
          ls -la "$CONTAINER/Documents" || true
          cp "$CONTAINER/Documents/ton.wav" out-ton/ 2>/dev/null || true
          cp "$CONTAINER/Documents/openal.log" out-ton/ 2>/dev/null || true
          cp "$CONTAINER/Documents/ios-frames.txt" out-ton/ 2>/dev/null || true
          cp -R "$CONTAINER/Library/Application Support/0ad/logs" out-ton/logs || true
          cp ~/Library/Logs/DiagnosticReports/pyrogenesis* out-ton/ 2>/dev/null || true
          xcrun simctl shutdown "$DEV" || true

      - name: Was it silence
        if: always()
        run: |
          echo "--- was openal-soft gesagt hat"
          tail -30 out-ton/openal.log 2>/dev/null || echo "(kein Protokoll)"
          echo "--- die Tonspur"
          ls -l out-ton/ton.wav 2>/dev/null || echo "(keine Datei -- der wave-Ruecken hat nicht aufgemacht)"
          grep -E "^Sound" out-ton/logs/system_info.txt 2>/dev/null || true
          # Der Kopf der Datei wird erst beim Schliessen des Geraets richtig
          # gestellt, und die App wird abgeschossen -- also nicht das wave-Modul,
          # das der Laengenangabe glauben wuerde, sondern die Rohdaten hinter
          # jedem moeglichen Kopf.
          python3 - <<'PY'
          import array, os, sys
          pfad = "out-ton/ton.wav"
          if not os.path.exists(pfad):
              print("keine Datei"); sys.exit(1)
          rohdaten = open(pfad, "rb").read()
          print(f"{len(rohdaten)} Bytes")
          koerper = rohdaten[128:]
          werte = array.array("h")
          werte.frombytes(koerper[:len(koerper) // 2 * 2])
          spitze = max((abs(w) for w in werte), default=0)
          laut = sum(1 for w in werte if abs(w) > 32)
          print(f"Spitze {spitze} von 32767, {laut} von {len(werte)} Abtastwerten ueber dem Rauschen")
          # 48 kHz stereo: eine Sekunde sind 96000 Werte. Unter einer Zehntel-
          # sekunde Ton waere ein Knacken und keine Musik.
          sys.exit(0 if spitze > 100 and laut > 9600 else 1)
          PY

      # The other shape of this port: nothing in the bundle, the app fetches the
      # data itself (patch 0029). Tested with the manifest that cuts the base mod
      # into 8 MiB parts -- 93 MB instead of 3.5 GB -- because what needs testing
      # is the offset arithmetic and the return into RunGameOrAtlas, and neither
      # gets truer at a larger size.
      #
      # This is also the only test of the phone's shape of the app that can run
      # without a phone: the same code path, the same manifest format.
      - name: Bundle it again, without the data
        run: |
          curl -fL --retry 3 -o manifest.parts \
              "https://github.com/${{ github.repository }}/releases/download/data-0.28.0/download.manifest.parts"
          cat manifest.parts
          BUNDLE_ID=org.smatkovi.zeroad.laden MANIFEST="$PWD/manifest.parts" \
              tools/make-app.sh "$SRC" - "$PWD/build/laden.app"

      - name: Let it fetch the data itself
        run: |
          set -x
          DEV=""
          for name in "iPhone 16" "iPhone 15" "iPhone 14"; do
              DEV=$(xcrun simctl create zeroad-laden "$name" 2>/dev/null) && break
              DEV=""
          done
          test -n "$DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$PWD/build/laden.app"
          # Die erste Probe hat ihre Berichte schon beurteilt; was hier liegen
          # bleibt, wuerde sonst diesem Lauf angerechnet (beide Programme heissen
          # pyrogenesis).
          rm -f ~/Library/Logs/DiagnosticReports/pyrogenesis*
          START=$(date +%s)
          # -mod=mod: this manifest has no public.zip, and the base mod on its own
          # is the mod-selection screen.
          xcrun simctl launch "$DEV" org.smatkovi.zeroad.laden -mod=mod
          CONTAINER=$(xcrun simctl get_app_container "$DEV" org.smatkovi.zeroad.laden data)
          # Straight away, with a chance of catching the progress bar: 93 MB from
          # GitHub's CDN is seconds.
          xcrun simctl io "$DEV" screenshot laden-0s.png || true
          for seconds in 45 120 240; do
              while [ "$(date +%s)" -lt $((START + seconds)) ]; do sleep 5; done
              xcrun simctl io "$DEV" screenshot "laden-${seconds}s.png" || true
              sips -r 270 "laden-${seconds}s.png" --out "laden-${seconds}s.png" \
                  > /dev/null 2>&1 || true
              echo "--- nach ${seconds}s:"
              cat "$CONTAINER/Documents/ios-frames.txt" 2>/dev/null | tail -8 \
                  || echo "(noch keine Notizen)"
          done
          mkdir -p out-laden
          cp -R "$CONTAINER/Library/Application Support/0ad/logs" out-laden/logs || true
          cp "$CONTAINER/Documents/ios-frames.txt" out-laden/ 2>/dev/null || true
          du -sh "$CONTAINER/Library/Application Support/0ad/data" 2>/dev/null \
              || echo "(kein heruntergeladenes Datenverzeichnis)"
          ls -la "$CONTAINER/Library/Application Support/0ad/data/mods/mod" 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/pyrogenesis* out-laden/ 2>/dev/null || true
          xcrun simctl shutdown "$DEV" || true

      - name: Did the download work
        if: always()
        run: |
          echo "--- Notizen"
          cat out-laden/ios-frames.txt 2>/dev/null || echo "(keine)"
          echo "--- Absturzbericht?"
          # Wie oben: nur was nicht am Herunterfahren gestorben ist.
          ECHT=$(grep -L XPC_EXIT_REASON_SIGTERM_TIMEOUT out-laden/*.ips 2>/dev/null || true)
          if ls out-laden/*.ips > /dev/null 2>&1; then
              for report in out-laden/*.ips; do
                  tools/symbolicate.py "$report" \
                      "$PWD/build/laden.app/pyrogenesis" || head -40 "$report"
              done
          else
              echo "(keiner)"
          fi
          # Every one of these is a different claim: the parts arrived and the
          # hash of the whole file matched; the directory was renamed, so
          # RootData() will find it; and the engine came up afterwards, which is
          # what returning into RunGameOrAtlas has to achieve.
          grep -q "mods/mod/mod.zip: complete and verified" out-laden/ios-frames.txt
          grep -q "data complete in" out-laden/ios-frames.txt
          test -f out-laden/logs/system_info.txt
          test -z "$ECHT"

      # --- Mehrspieler: zwei Simulatoren, eine Partie ------------------------
      #
      # The last big question the README had open. Direct IP only, and that is
      # not a limitation of this arm but of the build: gloox and gnutls are
      # skipped, `CNetClient::TryToConnectWithSTUN` opens with
      # `ENSURE(g_XmppClient)`, and `--without-lobby` leaves that null.
      #
      # Three things make it testable at all, and each is a reading of the
      # source rather than a hope:
      #
      # * **There is no discovery anywhere in 0 A.D.'s networking** -- no
      #   broadcast, no multicast, no LAN game list (`CNetServerWorker::Multicast`
      #   is a unicast loop over sessions). So nothing here needs Apple's
      #   multicast entitlement, which is what the README assumed would be in the
      #   way.
      # * **127.0.0.1 is the address a host already hands its own client** on
      #   every platform (`JSInterface_Network.cpp`, `SetupServerData("127.0.0.1",
      #   port)`), and loopback is the one address exempt from the Local Network
      #   permission on iOS and on macOS. Not the runner's en0 address, and not
      #   "localhost": `enet_address_set_host` is AF_INET only.
      # * The server binds one UDP socket on `ENET_HOST_ANY` and **the joiner
      #   binds nothing at all** (`CreateHost(nullptr, ...)`), so there is no
      #   second port to reserve and no way for the two to collide.
      #
      # What no document settles is whether two booted simulator devices share
      # the host's loopback. They are ordinary macOS process trees, so they
      # should -- and the arm measures it instead of assuming it: `lsof` on UDP
      # 20595, run from the runner itself.
      - name: Play against each other
        run: |
          set -x
          # Platz zuerst. Jeder fertige Arm laesst einen Container mit den
          # 3,4 GB Spieldaten stehen, und hier kommen zwei dazu -- das ist die
          # Stelle, an der die Platte des Laeufers eng wird. Die Geraete der
          # anderen Arme sind ausgewertet, ihre Beweise liegen in out*/.
          df -h /
          for name in zeroad zeroad-partie zeroad-ton zeroad-laden; do
              for udid in $(xcrun simctl list devices | sed -nE "s/^[[:space:]]*${name} \(([-0-9A-Fa-f]+)\).*/\1/p"); do
                  xcrun simctl shutdown "$udid" 2>/dev/null || true
                  xcrun simctl delete "$udid" || true
              done
          done
          df -h /

          WIRT=""; GAST=""
          for name in "iPhone 16" "iPhone 15" "iPhone 14"; do
              WIRT=$(xcrun simctl create zeroad-wirt "$name" 2>/dev/null) || { WIRT=""; continue; }
              GAST=$(xcrun simctl create zeroad-gast "$name" 2>/dev/null) || { GAST=""; continue; }
              break
          done
          test -n "$WIRT"; test -n "$GAST"
          xcrun simctl boot "$WIRT"
          xcrun simctl boot "$GAST"
          xcrun simctl bootstatus "$WIRT" -b
          xcrun simctl bootstatus "$GAST" -b
          xcrun simctl install "$WIRT" "$PWD/build/pyrogenesis.app"
          xcrun simctl install "$GAST" "$PWD/build/pyrogenesis.app"
          df -h /
          rm -f ~/Library/Logs/DiagnosticReports/pyrogenesis*
          mkdir -p out-mp/wirt out-mp/gast
          C_WIRT=$(xcrun simctl get_app_container "$WIRT" org.smatkovi.zeroad data)
          C_GAST=$(xcrun simctl get_app_container "$GAST" org.smatkovi.zeroad data)
          # Sonst wuerde der Vergleich unten eine Datei mit sich selbst
          # vergleichen und immer gruen sein.
          test "$C_WIRT" != "$C_GAST"
          echo "$WIRT" > out-mp/udid-wirt.txt
          echo "$GAST" > out-mp/udid-gast.txt

          # **Erst beide Buendel warmlaufen lassen.** Der Wirt haelt seinen
          # Hauptthread in Autostarts Warteschleife fest, solange der Gast
          # startet -- und ein *kalter* Start dieses 3,4-GB-Buendels hat in
          # diesem Projekt schon 169 s gebraucht, bevor der Prozess ueberhaupt
          # existierte. Minutenlang untaetig und nie aktiviert ist genau der
          # Zustand, in dem iOS eine App abraeumt. Ein Leerstart pro Geraet
          # bezahlt die einmaligen Kosten (Signaturpruefung, Seiteneinlagerung);
          # der echte Start ist danach warm und dauert Sekunden.
          WARM=$(date +%s)
          for dev in "$WIRT" "$GAST"; do
              xcrun simctl launch "$dev" org.smatkovi.zeroad || true
              xcrun simctl terminate "$dev" org.smatkovi.zeroad || true
          done
          echo "Warmlauf beider Buendel: $(($(date +%s) - WARM))s"

          # Der Wirt. Kein Petra auf keiner Seite: cmd_line_args.js legt die KI
          # auf die Plaetze 0 und 1, *bevor* autostart_host.js die Spielerzahl auf
          # die Zahl der verbundenen Sitzungen setzt -- die beiden Menschen
          # landeten dann auf Plaetzen, die schon eine KI hat. Und zwei
          # Software-GLES-Instanzen auf drei Kernen sind teuer genug.
          # -autostart=MAP muss daneben stehen: ohne Karte waehlt GameSetup
          # autostartHost mit networked=false, also ein Einzelspiel, das nichts
          # anbietet. Verschiedene Spielernamen sind Pflicht, nicht Zierde: der
          # Server wirft einen gleichen Namen mit NDR_PLAYERNAME_IN_USE hinaus,
          # und beide Vorgaben sind "anonymous".
          AUS_WIRT=$(xcrun simctl launch "$WIRT" org.smatkovi.zeroad \
              -autostart=random/mainland -autostart-size=128 -autostart-players=2 \
              -autostart-seed=1 -autostart-victory=endless \
              -autostart-host -autostart-host-players=2 \
              -autostart-playername=Wirt -autostart-port=20595)
          echo "$AUS_WIRT"
          # Die Uhr laeuft ab *hier*, nicht ab vor dem Start: sonst frisst der
          # Start selbst das Zeitfenster, das der Probe gehoert.
          START=$(date +%s)
          PID_WIRT=$(printf '%s' "$AUS_WIRT" | sed -E 's/.*: ([0-9]+).*/\1/')

          # Horcht er? Das ist die eine Annahme, fuer die es keine Apple-Quelle
          # gibt -- eine App im Simulator ist ein Prozess des Wirtsrechners, also
          # fragt der Wirtsrechner.
          # **Nicht nach "pyrogenesis" greifen**: lsof schneidet die Spalte
          # COMMAND auf neun Zeichen ab und schreibt "pyrogenes". Der erste Lauf
          # hat deshalb seine vollen 420 s abgewartet und nichts gefunden --
          # waehrend das lsof danach den Prozess sauber auf UDP *:20595 zeigte.
          # Also: gibt es ueberhaupt eine Datenzeile?
          HORCHT=""
          set +x
          while [ "$(date +%s)" -lt $((START + 420)) ]; do
              if [ -n "$(lsof -nP -iUDP:20595 2>/dev/null | sed 1d)" ]; then
                  HORCHT=$(($(date +%s) - START))
                  break
              fi
              sleep 3
          done
          set -x
          lsof -nP -iUDP:20595 > out-mp/lsof-20595.txt 2>&1 || true
          echo "${HORCHT:-}" > out-mp/wirt-horcht.txt
          echo "Wirt horcht nach: ${HORCHT:-(nie in 420 s)}s"

          # Der Gast. Nichts als Adresse, Port und Name: AutoStartClient liest
          # keine Spieleinstellungen, er bekommt sie im "start"-Paket des Wirts.
          AUS_GAST=$(xcrun simctl launch "$GAST" org.smatkovi.zeroad \
              -autostart-client=127.0.0.1 -autostart-port=20595 \
              -autostart-playername=Gast)
          echo "$AUS_GAST"
          START_GAST=$(date +%s)
          PID_GAST=$(printf '%s' "$AUS_GAST" | sed -E 's/.*: ([0-9]+).*/\1/')
          echo "Wirt $PID_WIRT / Gast $PID_GAST"

          N_WIRT="$C_WIRT/Documents/ios-frames.txt"
          N_GAST="$C_GAST/Documents/ios-frames.txt"
          # Bis *beide* eine Runde haben. Zwei Kartenerzeugungen laufen hier
          # gleichzeitig, jede in JavaScript ohne JIT -- die 27 s des Einzelspiels
          # sind die Untergrenze, nicht die Erwartung.
          BEIDE=""
          set +x
          while [ "$(date +%s)" -lt $((START_GAST + 900)) ]; do
              sleep 10
              if grep -qE "turn [0-9]+" "$N_WIRT" 2>/dev/null && \
                 grep -qE "turn [0-9]+" "$N_GAST" 2>/dev/null; then
                  BEIDE=$(($(date +%s) - START_GAST))
                  break
              fi
          done
          set -x
          echo "${BEIDE:-}" > out-mp/erste-runde.txt
          echo "beide in einer Runde nach: ${BEIDE:-(nie in 900 s)}s"
          tail -3 "$N_WIRT" 2>/dev/null || echo "(Wirt: keine Notizen)"
          tail -3 "$N_GAST" 2>/dev/null || echo "(Gast: keine Notizen)"

          # Vier Minuten spielen lassen -- und die Rundenzahlen davor und danach
          # festhalten. Ohne das beweist die Probe nur, dass die beiden *einmal*
          # zusammen waren: ein Gast, der nach vierzig Runden wegbricht,
          # hinterlaesst eine Datei mit steigenden Rundenzahlen und einen Wirt,
          # der allein weiterlaeuft. Die Frage, fuer die dieser Arm existiert,
          # ist aber, ob zwei Instanzen auf drei Kernen eine Partie *tragen*.
          runde_jetzt() { grep -oE "turn [0-9]+" "$1" 2>/dev/null | tail -1 | awk '{print $2}'; }
          VOR_WIRT=$(runde_jetzt "$N_WIRT"); VOR_GAST=$(runde_jetzt "$N_GAST")
          SPIEL=$(date +%s)
          set +x
          while [ "$(date +%s)" -lt $((SPIEL + 240)) ]; do sleep 10; done
          set -x
          NACH_WIRT=$(runde_jetzt "$N_WIRT"); NACH_GAST=$(runde_jetzt "$N_GAST")
          printf '%s %s %s %s\n' "${VOR_WIRT:-0}" "${NACH_WIRT:-0}" "${VOR_GAST:-0}" "${NACH_GAST:-0}" \
              > out-mp/weiter.txt
          cat out-mp/weiter.txt
          xcrun simctl io "$WIRT" screenshot mp-wirt.png || true
          xcrun simctl io "$GAST" screenshot mp-gast.png || true
          for f in mp-wirt.png mp-gast.png; do
              sips -r 270 "$f" --out "$f" > /dev/null 2>&1 || true
          done
          ps -o pid,%cpu,rss -p "$PID_WIRT" > out-mp/last.txt 2>&1 || true
          ps -o pid,%cpu,rss -p "$PID_GAST" >> out-mp/last.txt 2>&1 || true
          vm_stat >> out-mp/last.txt 2>&1 || true

          # **Beide im selben Augenblick anhalten.** Ein Signal, zwei Prozesse:
          # was danach in den Aufzeichnungen steht, ist an derselben Wanduhr
          # abgelesen. Sonst koennte die spaeter beendete Seite noch Runden
          # nachlegen, und der Abstand der Rundenzahlen -- die einzige Groesse,
          # die Gleichschritt von "zwei Partien nebeneinander" unterscheidet --
          # waere keine Aussage mehr. Keine Fortsetzung danach, die Prozesse
          # werden mit dem Geraet abgeraeumt.
          kill -STOP "$PID_WIRT" "$PID_GAST" || true

          einsammeln() {
              rolle=$1; behaelter=$2; dev=$3
              cp "$behaelter/Documents/ios-frames.txt" "out-mp/$rolle/" 2>/dev/null || true
              cp -R "$behaelter/Library/Application Support/0ad/logs" "out-mp/$rolle/logs" 2>/dev/null || true
              # Die Aufzeichnung ist das Beweisstueck: ihre erste Zeile traegt die
              # matchID des Wirts, und danach steht jede Runde mit ihrem Abdruck
              # darin, pro Runde gespuelt.
              find "$behaelter/Library/Application Support/0ad/replays" \
                  -name commands.txt -exec cp {} "out-mp/$rolle/commands.txt" \; 2>/dev/null || true
              xcrun simctl spawn "$dev" log show --last 60m --style compact \
                  --predicate 'process == "pyrogenesis"' \
                  > "out-mp/$rolle/system-log.txt" 2>&1 || true
              ls -la "out-mp/$rolle" || true
          }
          einsammeln wirt "$C_WIRT" "$WIRT"
          einsammeln gast "$C_GAST" "$GAST"

          # Absturzberichte heissen auf beiden Seiten pyrogenesis; zugeordnet
          # wird ueber die Geraete-Kennung im Pfad des Prozesses im Bericht.
          for bericht in ~/Library/Logs/DiagnosticReports/pyrogenesis*; do
              [ -e "$bericht" ] || continue
              if grep -q "$WIRT" "$bericht"; then cp "$bericht" out-mp/wirt/ || true
              elif grep -q "$GAST" "$bericht"; then cp "$bericht" out-mp/gast/ || true
              else cp "$bericht" out-mp/ || true; fi
          done
          # Wieder loslaufen lassen, bevor heruntergefahren wird: ein
          # angehaltener Prozess beantwortet kein SIGTERM, und simctl wartet
          # sonst je Geraet seine Zeitueberschreitung ab. Die Beweise sind zu
          # diesem Zeitpunkt laengst kopiert, ein paar Runden mehr aendern
          # nichts mehr.
          kill -CONT "$PID_WIRT" "$PID_GAST" || true
          xcrun simctl shutdown "$WIRT" || true
          xcrun simctl shutdown "$GAST" || true

      - name: Did they play together
        if: always()
        run: |
          echo "--- horcht der Wirt auf 20595?"
          cat out-mp/lsof-20595.txt 2>/dev/null | head -5 || echo "(nichts)"
          echo "--- Notizen Wirt"; tail -6 out-mp/wirt/ios-frames.txt 2>/dev/null || echo "(keine)"
          echo "--- Notizen Gast"; tail -6 out-mp/gast/ios-frames.txt 2>/dev/null || echo "(keine)"
          echo "--- was der Wirt ueber Verbindungen sagt"
          sed -e 's/<[^>]*>//g' out-mp/wirt/logs/mainlog.html 2>/dev/null \
              | grep -iE "Net server|Net client|connection" | tail -12 || true
          echo "--- was der Gast sagt"
          sed -e 's/<[^>]*>//g' out-mp/gast/logs/mainlog.html 2>/dev/null \
              | grep -iE "Net server|Net client|connection|Disconnect" | tail -12 || true
          echo "--- Last"; cat out-mp/last.txt 2>/dev/null | head -8 || true

          # Die Beweise muessen *da* sein, bevor irgendetwas ueber sie behauptet
          # wird. Ein fehlendes oos_dump ist sonst genau so gruen wie keins.
          test -f out-mp/wirt/ios-frames.txt
          test -f out-mp/gast/ios-frames.txt
          test -d out-mp/wirt/logs
          test -d out-mp/gast/logs
          # Nicht `test -s`: `echo ""` schreibt einen Zeilenumbruch, die Datei ist
          # damit ein Byte gross und die Schranke waere immer gruen. Der erste
          # Lauf ist genau so durchgegangen, ohne die Frage zu beantworten.
          test -n "$(cat out-mp/wirt-horcht.txt)"
          grep -q "UDP" out-mp/lsof-20595.txt

          python3 - <<'PY'
          import json, os, sys

          def lies(rolle):
              pfad = "out-mp/%s/commands.txt" % rolle
              if not os.path.exists(pfad):
                  return None
              zeilen = open(pfad, encoding="utf-8", errors="replace").read().split("\n")
              kopf = {}
              if zeilen and zeilen[0].startswith("start "):
                  try:
                      kopf = json.loads(zeilen[0][6:])
                  except Exception as e:
                      print("Kopf von %s unlesbar: %s" % (rolle, e))
              runden, abdruecke, jetzt = [], {}, None
              for z in zeilen:
                  t = z.split()
                  if not t:
                      continue
                  if t[0] == "turn" and len(t) >= 2:
                      try:
                          jetzt = int(t[1]); runden.append(jetzt)
                      except ValueError:
                          pass
                  elif t[0] in ("hash", "hash-quick") and len(t) >= 2 and jetzt is not None:
                      abdruecke[jetzt] = (t[0], t[1])
              return {"matchID": kopf.get("matchID"), "runden": runden,
                      "max": max(runden) if runden else 0, "abdruecke": abdruecke}

          w, g = lies("wirt"), lies("gast")
          for name, d in (("Wirt", w), ("Gast", g)):
              if d is None:
                  print("%s: keine Aufzeichnung" % name)
              else:
                  print("%s: matchID %s, %d Runden, hoechste %d, %d Abdruecke"
                        % (name, d["matchID"], len(d["runden"]), d["max"], len(d["abdruecke"])))

          fehler = []
          if w is None or g is None:
              fehler.append("eine der beiden Seiten hat keine Aufzeichnung geschrieben")
          else:
              # 1. Dieselbe Partie. Die matchID entsteht genau einmal, auf dem
              #    Wirt, aus 64 Zufallsbits, und reist im "start"-Paket. Dass sie
              #    in einer Datei steht, die der *andere* Prozess geschrieben hat,
              #    kann nur ein Beitritt erzeugen.
              if not w["matchID"] or w["matchID"] != g["matchID"]:
                  fehler.append("matchID verschieden oder leer: %s / %s" % (w["matchID"], g["matchID"]))
              # 2. Gleichschritt. Der Server rueckt eine Runde erst vor, wenn jeder
              #    nicht-zuschauende Client bereit ist, also kann der Abstand
              #    COMMAND_DELAY_MP nicht ueberschreiten. Beide Prozesse wurden im
              #    selben Augenblick angehalten, deshalb ist der Abstand eine
              #    Aussage und keine Messlatenz.
              abstand = abs(w["max"] - g["max"])
              print("Abstand der hoechsten Runden: %d (COMMAND_DELAY_MP = 4)" % abstand)
              if abstand > 4:
                  fehler.append("Abstand %d > 4: das war kein Gleichschritt" % abstand)
              # 3. Es wurde wirklich gespielt.
              if w["max"] < 30 or g["max"] < 30:
                  fehler.append("zu wenige Runden: %d / %d" % (w["max"], g["max"]))
              # 4. Und beide haben dasselbe gerechnet. Beweist fuer sich noch kein
              #    Zusammenspiel -- zwei Einzelpartien mit derselben Saat auch --,
              #    deshalb steht es hinter der matchID und nicht davor.
              gemeinsam = sorted(set(w["abdruecke"]) & set(g["abdruecke"]))
              ungleich = [t for t in gemeinsam if w["abdruecke"][t] != g["abdruecke"][t]]
              print("gemeinsame Runden mit Abdruck: %d, davon ungleich: %d"
                    % (len(gemeinsam), len(ungleich)))
              if len(gemeinsam) < 30:
                  fehler.append("nur %d gemeinsame Runden mit Abdruck" % len(gemeinsam))
              if ungleich:
                  fehler.append("Abdruecke unterscheiden sich in den Runden %s" % ungleich[:10])
              verschiedene = len(set(w["abdruecke"].values()))
              print("verschiedene Abdruecke beim Wirt: %d (ohne KI ruehrt sich wenig)" % verschiedene)

          open("out-mp/urteil.txt", "w").write("\n".join(fehler) if fehler else "zusammen gespielt\n")
          for f in fehler:
              print("FEHLER: " + f)
          sys.exit(1 if fehler else 0)
          PY

          echo "--- liefen beide am Ende noch?"
          read VW NW VG NG < out-mp/weiter.txt || true
          echo "Wirt $VW -> $NW, Gast $VG -> $NG (in vier Minuten)"
          [ "${NW:-0}" -gt "${VW:-0}" ]
          [ "${NG:-0}" -gt "${VG:-0}" ]

          echo "--- wurde jemand hinausgeworfen?"
          # Der Abstand oben faengt einen weggebrochenen Gast schon, aber nur als
          # Zahl. Diese beiden Zeilen sagen, *dass* es eine Trennung war.
          RAUS_W=$(sed -e 's/<[^>]*>//g' out-mp/wirt/logs/mainlog.html 2>/dev/null \
              | grep -c "Net server: Disconnected" || true)
          RAUS_G=$(sed -e 's/<[^>]*>//g' out-mp/gast/logs/mainlog.html 2>/dev/null \
              | grep -c "Net client: Disconnected" || true)
          echo "Trennungen: Wirt ${RAUS_W:-0}, Gast ${RAUS_G:-0}"
          [ "${RAUS_W:-0}" -eq 0 ]
          [ "${RAUS_G:-0}" -eq 0 ]

          echo "--- der Wirt hat Verbindungen angenommen"
          # Zwei Zeilen, nicht eine: der Wirt verbindet seinen *eigenen* Client
          # ueber dasselbe Loopback, also erscheint eine Zeile auch ohne Gast.
          # Beweis fuer den Gast ist die matchID oben, nicht diese Zahl.
          ANGENOMMEN=$(sed -e 's/<[^>]*>//g' out-mp/wirt/logs/mainlog.html 2>/dev/null \
              | grep -c "Received connection from" || true)
          echo "angenommene Verbindungen: ${ANGENOMMEN:-0}"
          [ "${ANGENOMMEN:-0}" -ge 2 ]

          echo "--- ist etwas auseinandergelaufen?"
          ls out-mp/*/logs/oos_dump* 2>/dev/null && { echo "OOS!"; exit 1; } || echo "(kein oos_dump)"

          echo "--- Absturzberichte?"
          ECHT=$(grep -L XPC_EXIT_REASON_SIGTERM_TIMEOUT out-mp/*/*.ips out-mp/*.ips 2>/dev/null || true)
          if ls out-mp/*/*.ips out-mp/*.ips > /dev/null 2>&1; then
              for bericht in out-mp/*/*.ips out-mp/*.ips; do
                  [ -e "$bericht" ] || continue
                  tools/symbolicate.py "$bericht" \
                      "$PWD/build/pyrogenesis.app/pyrogenesis" || head -30 "$bericht"
              done
          else
              echo "(keiner)"
          fi
          test -z "$ECHT"

      - name: Collect the logs
        if: always()
        run: |
          mkdir -p out
          # config.log is what says why a configure gave up, and it sits deep.
          find "$SRC/libraries/macos" -name config.log 2>/dev/null | while read -r f; do
              lib=$(printf '%s' "$f" | sed "s|.*/libraries/macos/||; s|/.*||")
              cp "$f" "out/$lib-config.log" || true
          done
          find "$SRC/libraries/macos" -maxdepth 2 -name "*.log" -exec cp {} out/ \; 2>/dev/null || true
          cp "${TMPDIR:-/tmp}/0ad-ios-build/build.log" out/ 2>/dev/null || true
          ls "$SRC/libraries/macos/pkgconfig" > out/pkgconfig.txt 2>&1 || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-build
          path: |
            out
            out-laden
            out-partie
            out-ton
            out-mp
            simulator*.png
            laden*.png
            partie-*.png
            mp-*.png
