name: "Build: simulator"

# Dependencies, then the engine. Separate from the probes: this is the long one,
# and everything it builds is cached, so a failure a third of the way through
# does not start over.
#
# Both halves run in the same job because premake needs the dependencies in the
# same tree (libraries/macos), and passing a 600 MB SpiderMonkey between jobs
# through an artifact would cost more than building the engine.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'patches/**'
      - 'tools/get-source.sh'
      - 'tools/build-deps-ios.sh'
      - 'tools/build-mozjs-ios.sh'
      - 'tools/ios-build.sh'
      - 'tools/show-platform.sh'
      - 'tools/make-app.sh'
      - 'tools/get-mod-data.sh'
      - 'tools/symbolicate.py'
      - '.github/workflows/build.yml'

jobs:
  simulator:
    name: pyrogenesis for the simulator
    runs-on: macos-14
    timeout-minutes: 300
    env:
      SDK: iphonesimulator
      SRC: ${{ github.workspace }}/ext/0ad-0.28.0
    steps:
      - uses: actions/checkout@v4

      - run: brew install ninja autoconf automake libtool

      - name: Cache the 0 A.D. source tarball
        uses: actions/cache@v4
        with:
          path: ext/0ad-0.28.0-unix-build.tar.xz
          key: zeroad-src-0.28.0

      # Restore and save separately, so a run that dies halfway keeps what it
      # built: the libraries are the expensive part (ICU wants a native build
      # first, SpiderMonkey is four minutes of its own).
      - name: Restore dependencies
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            ext/0ad-0.28.0/libraries/macos
            ext/0ad-0.28.0/libraries/source/spidermonkey/lib
            ext/0ad-0.28.0/libraries/source/spidermonkey/include-release
          key: deps-iphonesimulator-0.28.0-v3
          restore-keys: deps-iphonesimulator-0.28.0-v3-

      - name: Fetch and patch the source
        run: tools/get-source.sh

      - name: Build the dependencies
        id: deps
        run: |
          set -o pipefail
          tools/build-deps-ios.sh "$SDK" "$SRC" 2>&1 | tail -n 400

      - name: Save dependencies
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ext/0ad-0.28.0/libraries/macos
            ext/0ad-0.28.0/libraries/source/spidermonkey/lib
            ext/0ad-0.28.0/libraries/source/spidermonkey/include-release
          key: deps-iphonesimulator-0.28.0-v3-${{ github.run_id }}

      - name: Build pyrogenesis
        run: |
          set -o pipefail
          tools/ios-build.sh "$SDK" "$SRC" 2>&1 | tail -n 200

      - name: What came out
        if: always()
        run: |
          ls -la "$SRC/binaries/system" || true
          tools/show-platform.sh "$SRC/binaries/system/pyrogenesis" || true
          # Does anything in here replace the system allocator? SpiderMonkey's
          # mozglue does on some platforms, and a process where the frameworks
          # allocate with one malloc and free with another crashes exactly the
          # way this one does: a null pointer deep inside libdispatch, at
          # different call sites each time.
          echo "--- eigene malloc-Definitionen im Programm:"
          nm -g "$SRC/binaries/system/pyrogenesis" 2>/dev/null \
              | grep -E " T _(malloc|free|realloc|calloc|valloc|posix_memalign)$" || echo "(keine)"
          echo "--- und in SpiderMonkey:"
          nm -g "$SRC/libraries/source/spidermonkey/lib/libmozjs128-release.a" 2>/dev/null \
              | grep -E " T _(malloc|free|realloc|calloc)$" | sort -u | head || echo "(keine)"
          echo "--- replace_malloc?"
          nm -g "$SRC/libraries/source/spidermonkey/lib/libmozjs128-release.a" 2>/dev/null \
              | grep -i "replace_malloc\|mozmem" | head -5 || true

      # The base mod is 89 MB inside a 1.4 GB data release, so it is fetched
      # once and cached, not kept in the repository.
      - name: Cache the base mod
        id: cache-mod
        uses: actions/cache@v4
        with:
          path: ext/smoke-data
          key: smoke-data-0.28.0-mit-public

      - name: Fetch the base mod
        if: steps.cache-mod.outputs.cache-hit != 'true'
        run: tools/get-mod-data.sh

      - name: Bundle it
        run: tools/make-app.sh "$SRC" "$PWD/ext/smoke-data" "$PWD/build/pyrogenesis.app"

      - name: Run it in the simulator
        id: smoke
        run: |
          set -x
          DEV=""
          for name in "iPhone 16" "iPhone 15" "iPhone 14"; do
              DEV=$(xcrun simctl create zeroad "$name" 2>/dev/null) && break
              DEV=""
          done
          test -n "$DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$PWD/build/pyrogenesis.app"
          # Not --console-pty: attached to a pipe it never returns (the GLES
          # probe sat in it for half an hour). The game says what happened in
          # its own logs, and the system log has its stdout.
          START=$(date +%s)
          # No -mod: the default is mod + public, which is the whole game.
          xcrun simctl launch "$DEV" org.smatkovi.zeroad
          CONTAINER=$(xcrun simctl get_app_container "$DEV" org.smatkovi.zeroad data)
          # The simulator renders GLES in software and SpiderMonkey has no JIT,
          # so this takes its time. Look three times instead of once, and ask
          # each time whether the process is actually busy: a picture that does
          # not change while the CPU is pegged is slow, the same picture with an
          # idle process is stuck. That is the difference worth measuring.
          for seconds in 60 120 240; do
              while [ "$(date +%s)" -lt $((START + seconds)) ]; do sleep 5; done
              xcrun simctl io "$DEV" screenshot "simulator-${seconds}s.png" || true
              # The simulator rotates the app to landscape and captures in the
              # device's native portrait, so every screenshot arrives on its
              # side. 270 degrees clockwise puts it upright; measured against
              # the first frame the port ever drew.
              sips -r 270 "simulator-${seconds}s.png" \
                  --out "simulator-${seconds}s.png" > /dev/null 2>&1 || true
              echo "--- nach ${seconds}s:"
              # Three questions, because the first two have each lied once
              # already: `simctl spawn ps` finds no ps inside the runtime, and
              # `ps -p` printed a bare header for a pid that pgrep had just
              # found. An app in the simulator is an ordinary host process, so
              # ask the host; ask launchctl inside the simulator as well; and
              # then ask the only thing that cannot be misread -- whether the
              # game's own log is still growing.
              ps aux | grep "[p]yrogenesis.app/pyrogenesis" \
                  || echo "(kein Host-Prozess)"
              xcrun simctl spawn "$DEV" launchctl list 2>/dev/null \
                  | grep -i zeroad || echo "(launchctl kennt es nicht)"
              wc -c "$CONTAINER/Library/Application Support/0ad/logs/mainlog.html" \
                  2>/dev/null || echo "(kein Protokoll)"
          done
          cp "simulator-240s.png" simulator.png || true
          mkdir -p out
          cp -R "$CONTAINER/Library/Application Support/0ad/logs" out/logs || true
          cp "$CONTAINER/Documents/ios-frames.txt" out/ 2>/dev/null || true
          # interestinglog.html holds the warnings and errors on their own.
          ls -la out/logs || true
          xcrun simctl spawn "$DEV" log show --last 5m --style compact \
              --predicate 'process == "pyrogenesis"' > out/system-log.txt 2>&1 || true
          # A crash lands here rather than in the game's own logs.
          cp ~/Library/Logs/DiagnosticReports/pyrogenesis* out/ 2>/dev/null || true
          xcrun simctl shutdown "$DEV" || true

      - name: What the game said
        if: always()
        run: |
          echo "--- system_info.txt"
          cat "out/logs/system_info.txt" 2>/dev/null || echo "(keine -- so weit kam es nicht)"
          # Reported, never gated: whether openal-soft's CoreAudio backend opens
          # a device in a headless simulator is the open question of the sound,
          # and a missing device is harmless at runtime (SoundManager logs a
          # warning and stays null). system_info.txt says which of the three
          # states happened.
          echo "--- Ton:"
          grep -E "^Sound" out/logs/system_info.txt 2>/dev/null \
              || echo "(keine Tonzeile -- so weit kam es nicht)"
          echo "--- mainlog"
          sed -e 's/<[^>]*>//g' out/logs/mainlog.html 2>/dev/null | tail -60 || true
          echo "--- Absturzbericht?"
          # XPC_EXIT_REASON_SIGTERM_TIMEOUT ist keiner: `simctl shutdown` schickt
          # SIGTERM, und ein Spiel mitten im Bildrueckruf beantwortet das nicht,
          # also raeumt das System es ab. Alles andere zaehlt.
          ECHT=$(grep -L XPC_EXIT_REASON_SIGTERM_TIMEOUT out/*.ips 2>/dev/null || true)
          if ls out/*.ips > /dev/null 2>&1; then
              for report in out/*.ips; do
                  tools/symbolicate.py "$report" \
                      "$PWD/build/pyrogenesis.app/pyrogenesis" || head -40 "$report"
              done
          else
              echo "(keiner)"
          fi
          echo "--- wurde ein Rahmen gezeichnet?"
          cat out/ios-frames.txt 2>/dev/null || echo "(die Datei gibt es nicht -- der Rueckruf lief nie)"
          # Reported, not yet a gate: frames 0-2 are noted before anything need
          # have been drawn, and whether this readback sees the engine's frame
          # or an undefined back buffer is not settled. A non-zero middle pixel
          # is evidence; a zero one is not yet a failure.
          grep "middle pixel" out/ios-frames.txt 2>/dev/null | tail -3 || true
          echo "--- Systemprotokoll"
          tail -40 out/system-log.txt 2>/dev/null || true
          # system_info.txt is written once the window and the GL context stand,
          # so it is the honest marker for "the engine started".
          test -f "out/logs/system_info.txt"
          # And a crash report means it did not survive, whatever the logs say.
          # The job reported success twice while the game was dying.
          test -z "$ECHT"


      # The other shape of this port: nothing in the bundle, the app fetches the
      # data itself (patch 0029). Tested with the manifest that cuts the base mod
      # into 8 MiB parts -- 93 MB instead of 3.5 GB -- because what needs testing
      # is the offset arithmetic and the return into RunGameOrAtlas, and neither
      # gets truer at a larger size.
      #
      # This is also the only test of the phone's shape of the app that can run
      # without a phone: the same code path, the same manifest format.
      - name: Bundle it again, without the data
        run: |
          curl -fL --retry 3 -o manifest.parts \
              "https://github.com/${{ github.repository }}/releases/download/data-0.28.0/download.manifest.parts"
          cat manifest.parts
          BUNDLE_ID=org.smatkovi.zeroad.laden MANIFEST="$PWD/manifest.parts" \
              tools/make-app.sh "$SRC" - "$PWD/build/laden.app"

      - name: Let it fetch the data itself
        run: |
          set -x
          DEV=""
          for name in "iPhone 16" "iPhone 15" "iPhone 14"; do
              DEV=$(xcrun simctl create zeroad-laden "$name" 2>/dev/null) && break
              DEV=""
          done
          test -n "$DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$PWD/build/laden.app"
          # Die erste Probe hat ihre Berichte schon beurteilt; was hier liegen
          # bleibt, wuerde sonst diesem Lauf angerechnet (beide Programme heissen
          # pyrogenesis).
          rm -f ~/Library/Logs/DiagnosticReports/pyrogenesis*
          START=$(date +%s)
          # -mod=mod: this manifest has no public.zip, and the base mod on its own
          # is the mod-selection screen.
          xcrun simctl launch "$DEV" org.smatkovi.zeroad.laden -mod=mod
          CONTAINER=$(xcrun simctl get_app_container "$DEV" org.smatkovi.zeroad.laden data)
          # Straight away, with a chance of catching the progress bar: 93 MB from
          # GitHub's CDN is seconds.
          xcrun simctl io "$DEV" screenshot laden-0s.png || true
          for seconds in 45 120 240; do
              while [ "$(date +%s)" -lt $((START + seconds)) ]; do sleep 5; done
              xcrun simctl io "$DEV" screenshot "laden-${seconds}s.png" || true
              sips -r 270 "laden-${seconds}s.png" --out "laden-${seconds}s.png" \
                  > /dev/null 2>&1 || true
              echo "--- nach ${seconds}s:"
              cat "$CONTAINER/Documents/ios-frames.txt" 2>/dev/null | tail -8 \
                  || echo "(noch keine Notizen)"
          done
          mkdir -p out-laden
          cp -R "$CONTAINER/Library/Application Support/0ad/logs" out-laden/logs || true
          cp "$CONTAINER/Documents/ios-frames.txt" out-laden/ 2>/dev/null || true
          du -sh "$CONTAINER/Library/Application Support/0ad/data" 2>/dev/null \
              || echo "(kein heruntergeladenes Datenverzeichnis)"
          ls -la "$CONTAINER/Library/Application Support/0ad/data/mods/mod" 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/pyrogenesis* out-laden/ 2>/dev/null || true
          xcrun simctl shutdown "$DEV" || true

      - name: Did the download work
        if: always()
        run: |
          echo "--- Notizen"
          cat out-laden/ios-frames.txt 2>/dev/null || echo "(keine)"
          echo "--- Absturzbericht?"
          # Wie oben: nur was nicht am Herunterfahren gestorben ist.
          ECHT=$(grep -L XPC_EXIT_REASON_SIGTERM_TIMEOUT out-laden/*.ips 2>/dev/null || true)
          if ls out-laden/*.ips > /dev/null 2>&1; then
              for report in out-laden/*.ips; do
                  tools/symbolicate.py "$report" \
                      "$PWD/build/laden.app/pyrogenesis" || head -40 "$report"
              done
          else
              echo "(keiner)"
          fi
          # Every one of these is a different claim: the parts arrived and the
          # hash of the whole file matched; the directory was renamed, so
          # RootData() will find it; and the engine came up afterwards, which is
          # what returning into RunGameOrAtlas has to achieve.
          grep -q "mods/mod/mod.zip: complete and verified" out-laden/ios-frames.txt
          grep -q "data complete in" out-laden/ios-frames.txt
          test -f out-laden/logs/system_info.txt
          test -z "$ECHT"

      - name: Collect the logs
        if: always()
        run: |
          mkdir -p out
          # config.log is what says why a configure gave up, and it sits deep.
          find "$SRC/libraries/macos" -name config.log 2>/dev/null | while read -r f; do
              lib=$(printf '%s' "$f" | sed "s|.*/libraries/macos/||; s|/.*||")
              cp "$f" "out/$lib-config.log" || true
          done
          find "$SRC/libraries/macos" -maxdepth 2 -name "*.log" -exec cp {} out/ \; 2>/dev/null || true
          cp "${TMPDIR:-/tmp}/0ad-ios-build/build.log" out/ 2>/dev/null || true
          ls "$SRC/libraries/macos/pkgconfig" > out/pkgconfig.txt 2>&1 || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-build
          path: |
            out
            out-laden
            simulator*.png
            laden*.png
