name: Probes

# Two questions, and deliberately nothing else. Everything about the port
# hangs on their answers, and both are cheaper to ask now than after a
# dependency stack has been built on top of a wrong assumption.
#
#   gles   Does the simulator on a GitHub runner really render OpenGL ES?
#          (NSR Reader proved Metal through Qt there. Not the same thing.)
#   mozjs  Does SpiderMonkey 128 configure and build for aarch64-apple-ios-sim?
#          Android got mozjs from Termux; here there is nobody to get it from.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  gles:
    name: OpenGL ES in the simulator
    runs-on: macos-14
    timeout-minutes: 60
    env:
      BUNDLE_ID: org.smatkovi.zeroad.probe
    steps:
      - uses: actions/checkout@v4

      - run: brew install ninja

      - name: Xcode and simulators
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list devicetypes | grep -i iphone | tail -5

      - name: Cache SDL2 (simulator)
        id: cache-sdl
        uses: actions/cache@v4
        with:
          path: ext/prefix-sim
          key: sdl2-2.32.8-iphonesimulator-v1

      - name: Build SDL2 for the simulator
        if: steps.cache-sdl.outputs.cache-hit != 'true'
        run: tools/build-sdl2-ios.sh iphonesimulator "$PWD/ext/prefix-sim"

      - name: Build the probe bundle
        run: |
          tools/make-probe-app.sh "$PWD/ext/prefix-sim" probe/triangle.c \
              "$BUNDLE_ID" "$PWD/build/triangle.app"

      - name: Run it in the simulator
        run: |
          set -x
          DEV=""
          for name in "iPhone 16" "iPhone 15" "iPhone 14"; do
              DEV=$(xcrun simctl create probe "$name" 2>/dev/null) && break
              DEV=""
          done
          test -n "$DEV"
          echo "DEV=$DEV" >> $GITHUB_ENV
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$PWD/build/triangle.app"
          xcrun simctl launch --console-pty "$DEV" "$BUNDLE_ID" > launch.log 2>&1 &
          LAUNCH=$!
          sleep 15
          xcrun simctl io "$DEV" screenshot simulator.png || true
          wait $LAUNCH || true
          DATA=$(xcrun simctl get_app_container "$DEV" "$BUNDLE_ID" data)
          cp "$DATA/Documents/probe.txt" . || true

      - name: What the probe saw
        run: |
          echo "--- probe.txt"
          cat probe.txt || echo "(keine Datei -- die App ist nicht bis dahin gekommen)"
          echo "--- launch.log"
          cat launch.log || true
          grep -q "^RESULT=ok" probe.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gles-probe
          path: |
            probe.txt
            launch.log
            simulator.png

  mozjs:
    name: SpiderMonkey 128 for the simulator
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Cache the 0 A.D. source tarball
        uses: actions/cache@v4
        with:
          path: ext/0ad-0.28.0-unix-build.tar.xz
          key: zeroad-src-0.28.0

      # Restored and saved separately so a failed attempt keeps its progress:
      # the unpacked tree is cached too, and a retry resumes instead of
      # downloading and patching again.
      - name: Restore build state
        id: cache-sm
        uses: actions/cache/restore@v4
        with:
          path: |
            ext/spidermonkey-0.28.0
            ext/prefix-sim-js
          key: mozjs-128.13.0-iphonesimulator-v1

      - name: Build SpiderMonkey
        id: build
        if: steps.cache-sm.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          tools/build-mozjs-ios.sh iphonesimulator "$PWD/ext/prefix-sim-js" 2>&1 | tee mozjs.log

      - name: Save build state
        if: always() && steps.cache-sm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ext/spidermonkey-0.28.0
            ext/prefix-sim-js
          key: mozjs-128.13.0-iphonesimulator-v1-${{ github.run_id }}

      - name: Collect the interesting files
        if: always()
        run: |
          mkdir -p out
          cp mozjs.log out/ 2>/dev/null || true
          find ext/spidermonkey-0.28.0 -name config.log -maxdepth 4 -exec cp {} out/ \; 2>/dev/null || true
          ls -la ext/prefix-sim-js/lib 2>/dev/null || echo "(keine Bibliotheken)"
          if [ -f ext/prefix-sim-js/lib/libmozjs128-release.a ]; then
              tools/show-platform.sh ext/prefix-sim-js/lib/libmozjs128-release.a || true
              lipo -info ext/prefix-sim-js/lib/libmozjs128-release.a
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mozjs-probe
          path: out
