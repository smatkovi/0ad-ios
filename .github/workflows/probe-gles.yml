name: "Probe: OpenGL ES"

# Does the simulator on a GitHub runner really render OpenGL ES? NSR Reader
# proved Metal through Qt there, which is not the same thing, and 0 A.D. has
# no Metal backend.
#
# Its own file, with a path filter, so fixing this probe does not restart the
# SpiderMonkey build -- that one runs for hours.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'probe/**'
      - 'tools/build-sdl2-ios.sh'
      - 'tools/make-probe-app.sh'
      - 'tools/show-platform.sh'
      - '.github/workflows/probe-gles.yml'

jobs:
  gles:
    name: OpenGL ES in the simulator
    runs-on: macos-14
    timeout-minutes: 45
    env:
      BUNDLE_ID: org.smatkovi.zeroad.probe
    steps:
      - uses: actions/checkout@v4

      - run: brew install ninja

      - name: Xcode and simulators
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list devicetypes | grep -i iphone | tail -5

      - name: Cache SDL2 (simulator)
        id: cache-sdl
        uses: actions/cache@v4
        with:
          path: ext/prefix-sim
          key: sdl2-2.32.8-iphonesimulator-v1

      - name: Build SDL2 for the simulator
        if: steps.cache-sdl.outputs.cache-hit != 'true'
        run: tools/build-sdl2-ios.sh iphonesimulator "$PWD/ext/prefix-sim"

      - name: Build the probe bundle
        run: |
          tools/make-probe-app.sh "$PWD/ext/prefix-sim" probe/triangle.c \
              "$BUNDLE_ID" "$PWD/build/triangle.app"

      - name: Run it in the simulator
        run: |
          set -x
          DEV=""
          for name in "iPhone 16" "iPhone 15" "iPhone 14"; do
              DEV=$(xcrun simctl create probe "$name" 2>/dev/null) && break
              DEV=""
          done
          test -n "$DEV"
          echo "DEV=$DEV" >> $GITHUB_ENV
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$PWD/build/triangle.app"
          # Not --console-pty: attached to a pipe instead of a terminal it does
          # not come back, and the step sat there for half an hour. Plain launch
          # returns as soon as the app is up; what the probe found is in its
          # report file anyway, and the system log has the stdout.
          xcrun simctl launch "$DEV" "$BUNDLE_ID"
          sleep 20
          xcrun simctl io "$DEV" screenshot simulator.png || true
          DATA=$(xcrun simctl get_app_container "$DEV" "$BUNDLE_ID" data)
          cp "$DATA/Documents/probe.txt" . || true
          xcrun simctl spawn "$DEV" log show --last 3m --style compact \
              --predicate 'process == "triangle"' > launch.log 2>&1 || true
          xcrun simctl shutdown "$DEV" || true

      - name: What the probe saw
        run: |
          echo "--- probe.txt"
          cat probe.txt || echo "(keine Datei -- die App ist nicht bis dahin gekommen)"
          echo "--- launch.log"
          cat launch.log || true
          grep -q "^RESULT=ok" probe.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gles-probe
          path: |
            probe.txt
            launch.log
            simulator.png
